<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ 'Create account' if mode == 'register' else 'Sign in' }} · AlphaScope</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/styles.css') }}">
</head>
<body data-theme="dark">
    <main class="auth-card glass-panel">
        <p class="eyebrow">AlphaScope</p>
        <h1>{{ 'Create your account' if mode == 'register' else 'Sign in' }}</h1>
        {% if error %}<p role="alert">{{ error }}</p>{% endif %}
        <form method="post" action="/{{ mode }}">
            <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
            <label for="email">Email</label>
            <input id="email" name="email" type="email" autocomplete="email" required maxlength="254">
            <label for="password">Password</label>
            <input id="password" name="password" type="password" autocomplete="{{ 'new-password' if mode == 'register' else 'current-password' }}" required minlength="{{ 12 if mode == 'register' else 1 }}" maxlength="256">
            <button class="primary-button" type="submit">{{ 'Create account' if mode == 'register' else 'Sign in' }}</button>
        </form>
        {% if mode == 'register' %}<p>Already registered? <a href="/login">Sign in</a></p>{% else %}<p>New here? <a href="/register">Create an account</a></p>{% endif %}
    </main>
</body>
</html>
